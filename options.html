<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Open in No Container Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <form id="options-form">
      <label for="hosts">Sites that always open without a container</label>
      <textarea id="hosts" spellcheck="false"></textarea>
      <div class="actions">
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
    <script src="no-container-sites.js"></script>
    <script src="options.js"></script>
  </body>
</html>
